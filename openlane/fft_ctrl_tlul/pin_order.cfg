#BUS_SORT

# NORTH edge — all SRAM bus signals cluster here, facing the two
# CF_SRAM_1024x32 banks placed above the FFT macro at the wrapper level.
# Pin grouping order: control first, then address, then write data, then BEN,
# then RWB+EN, then read data per bank. Bus signals stay together for clean
# horizontal routing channels into bank pins.
#N
sram_clk_o
sram_rwb_o
sram_en_o\[.*\]
sram_addr_o\[.*\]
sram_wdata_o\[.*\]
sram_ben_o\[.*\]
sram_rdata0_i\[.*\]
sram_rdata1_i\[.*\]

# WEST edge — TL-UL host-to-device (input from xbar)
#W
tl_i\[.*\]

# EAST edge — TL-UL device-to-host (output to xbar)
#E
tl_o\[.*\]

# SOUTH edge — clock, reset, and interrupt outputs
#S
clk_i
rst_ni
fft_done_o
fft_error_o
